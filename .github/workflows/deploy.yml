name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # main.js was mechanically absorbed into rpgace_core.js Aug 20 2026 and
      # deleted (see CLAUDE.md's Architecture section) - this check silently
      # broke every push since (node --check main.js -> MODULE_NOT_FOUND,
      # exit 1) because this workflow file was never on the "grep for a
      # hardcoded main.js reference" list at the time, unlike
      # .claude/settings.json's check_commands (fixed Aug 22) and
      # scripts/graphify_river_group.py (fixed Aug 20). Found via a GitHub
      # Actions failure-email Alex forwarded Aug 27, reproduced locally
      # before fixing (rule 4). This never affected the live app - Vercel's
      # own native GitHub integration deploys every push independently of
      # this Action (confirmed via list_deployments: every commit shows
      # state:READY regardless of this workflow's own pass/fail history).
      - name: Check JS syntax
        run: node --check rpgace_core.js && echo "JS syntax clean"

      # Advisory only, per the July 25 Aintergration pass on emilkowalski/skills +
      # pbakaus/impeccable - real deterministic anti-pattern findings (contrast,
      # layout-thrash transitions, oversized/undersized text) reported for a human
      # to read, never blocking a deploy. See CLAUDE.md's Aintergration section.
      - name: Design pattern check (advisory)
        continue-on-error: true
        run: npx --yes impeccable detect index.html style.css || true

      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
