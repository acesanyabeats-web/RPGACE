name: Video analysis queue

# Oct 11 2026 - always-on Content Intelligence without Alex's laptop.
# Every 10 minutes: if anything is queued in intel_jobs, install the pipeline
# and run scripts/intel_cloud_runner.py (which runs local_server/rpgace_intel.py
# unchanged). The cheap first step skips everything when the queue is empty.
# Needs repo secret INTEL_ANTHROPIC_KEY (optional YT_COOKIES lets it try YouTube). Logs are public (public repo): the
# runner keeps titles/transcripts/reports off them.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: intel-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Anything queued?
        id: q
        env:
          HAS_YT: ${{ secrets.YT_COOKIES != '' }}
        run: |
          # VW-0 (Oct 20 2026): first put jobs stuck in 'processing' for over
          # 2 h back in the queue, using the same rule as both runners
          # (local_server/intel_common.py, fetched alone - no checkout needed).
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/local_server/intel_common.py" -o /tmp/intel_common.py && \
          python3 - <<'PY' || echo "::warning::stuck-job reset skipped"
          import sys, json, urllib.request
          sys.path.insert(0, "/tmp"); import intel_common as ic
          k = "sb_publishable_0Z8C5X-FOLrw95VYKxZVCw_4golMyXf"
          req = urllib.request.Request("https://gripopghczmrbrhqtqbm.supabase.co/rest/v1/" + ic.stuck_query(), method="PATCH",
              data=json.dumps(ic.STUCK_RESET).encode(), headers={"apikey": k, "Authorization": "Bearer " + k,
              "Content-Type": "application/json", "Prefer": "return=representation"})
          with urllib.request.urlopen(req, timeout=20) as r:
              print("stuck jobs re-queued:", len(json.loads(r.read() or b"[]")))
          PY
          # Without YouTube cookies the cloud can't take YouTube links (bot
          # check), so they don't count - they wait for the laptop.
          f=""; [ "$HAS_YT" = "true" ] || f="&url=not.ilike.*youtu*"
          n=$(curl -s "https://gripopghczmrbrhqtqbm.supabase.co/rest/v1/intel_jobs?status=eq.queued&select=id$f" \
            -H "apikey: sb_publishable_0Z8C5X-FOLrw95VYKxZVCw_4golMyXf" \
            -H "Authorization: Bearer sb_publishable_0Z8C5X-FOLrw95VYKxZVCw_4golMyXf" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)')
          echo "queued=$n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - if: steps.q.outputs.n != '0'
        uses: actions/checkout@v4

      - if: steps.q.outputs.n != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - if: steps.q.outputs.n != '0'
        name: Cache pip + Whisper model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/whisper
          key: intel-${{ runner.os }}-whisper-small-v1

      # yt-dlp needs a JavaScript runtime (Deno) to read YouTube - without it
      # the Oct 11 first run failed the YouTube Short ("No supported
      # JavaScript runtime could be found").
      - if: steps.q.outputs.n != '0'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - if: steps.q.outputs.n != '0'
        name: Install ffmpeg, yt-dlp, Whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install -q -U yt-dlp certifi
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q openai-whisper
          echo "yt-dlp $(yt-dlp --version)"

      - if: steps.q.outputs.n != '0'
        name: Analyse queued videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.INTEL_ANTHROPIC_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          # The runner sets its own scratch HOME for the pipeline; point
          # Whisper's model cache back at the cached folder.
          export XDG_CACHE_HOME="$HOME/.cache"
          python scripts/intel_cloud_runner.py
